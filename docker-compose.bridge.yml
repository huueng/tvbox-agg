# 端口映射版：不想用 host 网络时用这个（适合 Portainer、需要和别的容器共用网络）,
# 代价是容器里拿不到 IPv6，纯 v6 的直播线路会被判成不可用。
#
# 用法：docker compose -f docker-compose.bridge.yml up -d
services:
  tvbox-agg:
    image: ghcr.io/huueng/tvbox-agg:latest
    container_name: tvbox-agg
    ports:
      - "${PORT:-5680}:5680"
    volumes:
      - ./data:/app/data
    environment:
      - TOKEN=${TOKEN:-}
      - BASE_URL=${BASE_URL:-}
      - TZ=${TZ:-Asia/Shanghai}
      - INTERVAL=${INTERVAL:-6}
      - WORKERS=${WORKERS:-4}
      - TIMEOUT=${TIMEOUT:-20}
      - DROP_AFTER=${DROP_AFTER:-3}
      - PROXY=${PROXY:-1}
      - MAX_ASSETS=${MAX_ASSETS:-25}
      - MAX_JAR_SITES=${MAX_JAR_SITES:-120}
    restart: unless-stopped
