# 直接复制到 Portainer / 群晖 / 飞牛「项目」里，也可以存成 docker-compose.yml 后 docker compose up -d
#
# 只有 TOKEN 建议改（面板密码），其余都可以不填。
# 想固定版本：把 image 里的 latest 改成 0.9.1
#
# 用端口映射（而不是 host 网络）是为了让 NAS 面板能显示端口。
# 代价：容器里拿不到 IPv6，纯 v6 的直播线路会测不出来，
#      在意这个就改用 docker-compose.host.yml。
services:
  tvbox-agg:
    image: ghcr.io/huueng/tvbox-agg:latest
    container_name: tvbox-agg
    restart: unless-stopped
    ports:
      # 左 = 宿主机对外端口（可以改），右 = 容器内监听端口（固定 5680，不要动）
      - "${PORT:-5680}:5680"
    volumes:
      - ./data:/app/data
    environment:
      # 面板密码 / 写接口令牌。强烈建议填：openssl rand -hex 12
      # 留空 = 不鉴权（内网自用可以，别暴露公网）
      - TOKEN=${TOKEN:-}
      # 写进配置的对外地址。一般留空（自动用你访问时的地址）
      # 走反代或多网卡时再填，例如 http://你的设备地址:5680
      - BASE_URL=${BASE_URL:-}
      - TZ=${TZ:-Asia/Shanghai}
      # 每 N 小时自动重聚合；0 = 只手动
      - INTERVAL=${INTERVAL:-6}
      - WORKERS=${WORKERS:-4}
      - TIMEOUT=${TIMEOUT:-20}
      - DROP_AFTER=${DROP_AFTER:-3}
      # 站点 API 走 /cms/ 代理，兼容性更好
      - PROXY=${PROXY:-1}
      - MAX_ASSETS=${MAX_ASSETS:-25}
      - MAX_JAR_SITES=${MAX_JAR_SITES:-120}
