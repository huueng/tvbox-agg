services:
  tvbox-agg:
    image: ghcr.io/huueng/tvbox-agg:0.9
    # 只想跑的话不用动上面这行（会自动拉镜像）。
    # 想用本地源码构建：把下面这行取消注释，然后 docker compose up -d --build
    # build: .
    container_name: tvbox-agg
    restart: unless-stopped
    # host 网络：直播源里有不少纯 IPv6 地址，bridge 网络拿不到 IPv6，
    # 测试时会把好源误判成死的。用 host 最省事。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      PORT: "${PORT:-5680}"   # 换端口：PORT=5690 docker compose up -d
      # 写进配置里的对外地址。留空会自动用你访问时的地址；
      # 走反向代理或多网卡时再填，比如 http://你的设备地址:5680
      BASE_URL: "${BASE_URL:-}"
      # 管理页 / 写接口的令牌，务必改掉。留空则自动生成并打印在日志里
      TOKEN: "${TOKEN:-}"
      INTERVAL: "6"          # 每 6 小时自动重聚合
      WORKERS: "4"           # 采集站对并发握手敏感，4 是实测平衡点
      TIMEOUT: "20"
      DROP_AFTER: "3"        # 连续失败 3 次才摘除
      PROXY: "1"             # 站点 API 走 /cms/<key> 代理，翻好 t= 参数
      MAX_ASSETS: "25"       # 全能档最多带几个扩展资源（jar/js/py）
      MAX_JAR_SITES: "120"   # 扩展站点总数上限
    volumes:
      - ./data:/app/data
